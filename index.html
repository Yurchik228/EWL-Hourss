    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.5); border-radius: 10px; }
        body { 
            background-color: #0b0f17; 
            color: #e8eefc; 
            margin: 0; 
            overscroll-behavior-y: contain;
        }
        #root:empty + #loader { display: flex; }
        #loader { display: none; }
    </style>
    <script type="importmap">

  "imports": {

    <script>
        // Помогает увидеть ошибку, если загрузка модулей провалилась
        window.onerror = function(msg, url, line, col, error) {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.innerHTML = '<div style="color: #ff4d4d; padding: 20px; text-align: center;">' +
                    '<div style="font-weight: bold; margin-bottom: 10px;">Błąd ładowania:</div>' +
                    '<div style="font-size: 11px; font-family: monospace; opacity: 0.8;">' + msg + '</div>' +
                    '</div>';
            }
            return false;
        };
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <div id="loader" style="position: fixed; inset: 0; align-items: center; justify-content: center; font-family: sans-serif; opacity: 0.8; pointer-events: none; flex-direction: column; gap: 12px;">
        <div style="font-weight: 900; letter-spacing: 0.2em; color: #3b82f6;">EWL CALCULATOR PRO</div>
        <div style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.5;">Inicjalizacja systemu...</div>
    </div>
